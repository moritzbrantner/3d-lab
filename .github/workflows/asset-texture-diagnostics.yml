name: asset-texture-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/asset-normal-textures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Capture formatter and compiler evidence
        shell: bash
        run: |
          cargo fmt --all
          git diff -- . > rustfmt.patch
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo $? > clippy.exit
          cargo test --all-features > test.log 2>&1
          echo $? > test.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: asset-texture-diagnostics
          path: |
            rustfmt.patch
            clippy.log
            clippy.exit
            test.log
            test.exit

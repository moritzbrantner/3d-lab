name: Renderer runtime evidence

on:
  workflow_call:

concurrency:
  group: renderer-runtime-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renderer-browser:
    name: Reusable renderer Chromium evidence
    uses: moritzbrantner/reusable-workflows/.github/workflows/runtime-evidence.yml@926b3919548a9e9680b7f7785cebeaf5b578138c
    with:
      job_name: Reusable renderer Chromium evidence
      profiler_revision: 9a7a451681c5598ec7aa888daf2a66cbbade3365
      workloads: profiles/runtime-profiler/renderer-browser.json
      workload_files: |
        package.json
        profiles/runtime-profiler/renderer-browser.json
        profiles/runtime-profiler/renderer-browser.mjs
        web/app/renderer-performance/page.tsx
        web/components/renderer-performance-canary.tsx
      prime_command: |
        bun install
        (cd web && bun install)
      browser: true
      browser_bun_version: "1.4.4"
      browser_site_directory: web/out
      browser_port: 4173
      browser_ready_path: /renderer-performance/
      browser_server_log_id: renderer
      browser_preflight_command: |
        bun scripts/renderer-presentation-smoke.mjs "$RUNNER_TEMP/renderer-presentation-smoke"
        bun run build:imported-character-wasm
        bun scripts/imported-character-browser-acceptance.ts "$RUNNER_TEMP/imported-character-browser-acceptance"
        bun scripts/inspection-character-browser-acceptance.ts "$RUNNER_TEMP/inspection-character-browser-acceptance"
        bun scripts/bundle-character-browser-acceptance.ts "$RUNNER_TEMP/bundle-character-browser-acceptance"
        bun scripts/fetch-ranger-acceptance.ts "$RUNNER_TEMP/ranger-rolling"
        bun scripts/compressed-bundle-browser-acceptance.ts "$RUNNER_TEMP/ranger-rolling" "$RUNNER_TEMP/compressed-bundle-acceptance"
      browser_build_command: (cd web && GITHUB_ACTIONS=false bun run build)
      browser_server_acceptance_command: |
        bun scripts/character-browser-smoke.mjs "$BROWSER_ORIGIN/skeletal-animation/" "$RUNNER_TEMP/character-browser-smoke"
        bun scripts/skeletal-inspection-browser-smoke.mjs "$BROWSER_ORIGIN/skeletal-animation/" "$RUNNER_TEMP/skeletal-inspection-browser-smoke"
        bun scripts/editor-snapshot-browser-smoke.mjs "$BROWSER_ORIGIN/editor/" "$RUNNER_TEMP/editor-snapshot-browser-smoke"
      browser_artifact_paths: |
        character-browser-smoke
        skeletal-inspection-browser-smoke
        editor-snapshot-browser-smoke
        renderer-presentation-smoke
        imported-character-browser-acceptance
        inspection-character-browser-acceptance
        bundle-character-browser-acceptance
        compressed-bundle-acceptance
        ranger-rolling/acquisition.json
      artifact_name: renderer-browser-runtime

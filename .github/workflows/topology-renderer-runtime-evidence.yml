name: Topology renderer runtime evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "web/lib/scene-editor-topology-persistent.ts"
      - "web/lib/scene-editor-topology-adjacency.ts"
      - "web/lib/scene-editor-history.ts"
      - "web/lib/topology-renderer-adapter.ts"
      - "web/app/topology-performance/**"
      - "web/components/topology-renderer-performance-canary.tsx"
      - "scripts/run-topology-renderer-canary.mjs"
      - "scripts/summarize-topology-browser-calibration.mjs"
      - "profiles/runtime-profiler/topology-renderer-browser.json"
      - "profiles/runtime-profiler/topology-renderer-browser.mjs"
      - ".github/workflows/topology-renderer-runtime-evidence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUNTIME_PROFILER_REV: 9a7a451681c5598ec7aa888daf2a66cbbade3365
  TOPOLOGY_BROWSER_CALIBRATION_RUNS: "6"

jobs:
  topology-renderer-browser:
    name: Topology renderer Chromium evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Check out exact base
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install pinned runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler --rev "$RUNTIME_PROFILER_REV" --locked

      - name: Give the base the identical topology renderer workload
        run: |
          set -euo pipefail
          mkdir -p \
            reference/profiles/runtime-profiler \
            reference/scripts \
            reference/web/app/topology-performance \
            reference/web/components \
            reference/web/lib
          cp candidate/package.json reference/package.json
          cp candidate/profiles/runtime-profiler/topology-renderer-browser.json reference/profiles/runtime-profiler/topology-renderer-browser.json
          cp candidate/profiles/runtime-profiler/topology-renderer-browser.mjs reference/profiles/runtime-profiler/topology-renderer-browser.mjs
          cp candidate/scripts/run-topology-renderer-canary.mjs reference/scripts/run-topology-renderer-canary.mjs
          cp candidate/web/app/topology-performance/page.tsx reference/web/app/topology-performance/page.tsx
          cp candidate/web/components/topology-renderer-performance-canary.tsx reference/web/components/topology-renderer-performance-canary.tsx
          if [ ! -f reference/web/lib/topology-renderer-adapter.ts ]; then
            cp candidate/web/lib/topology-renderer-adapter.ts reference/web/lib/topology-renderer-adapter.ts
          fi
          git -C reference add \
            package.json \
            profiles/runtime-profiler/topology-renderer-browser.json \
            profiles/runtime-profiler/topology-renderer-browser.mjs \
            scripts/run-topology-renderer-canary.mjs \
            web/app/topology-performance/page.tsx \
            web/components/topology-renderer-performance-canary.tsx \
            web/lib/topology-renderer-adapter.ts
          if ! git -C reference diff --cached --quiet; then
            git -C reference \
              -c user.name='runtime-profiler' \
              -c user.email='runtime-profiler@invalid' \
              commit -m 'chore: attach comparable topology renderer workload'
          fi

      - name: Install browser workload dependencies
        run: |
          (cd reference && bun install)
          (cd candidate && bun install)
          (cd reference/web && bun install)
          (cd candidate/web && bun install)
          (cd candidate && bunx playwright install --with-deps chromium)

      - name: Build static benchmark sites
        run: |
          (cd reference/web && GITHUB_ACTIONS=false bun run build)
          (cd candidate/web && GITHUB_ACTIONS=false bun run build)

      - name: Capture deterministic semantic evidence
        run: |
          set -euo pipefail

          capture_semantics() {
            local side="$1"
            local output="$2"
            local server_log="$3"
            python3 -m http.server 4173 \
              --bind 127.0.0.1 \
              --directory "$side/web/out" \
              >"$server_log" 2>&1 &
            local server_pid=$!
            if ! curl --fail --retry 20 --retry-delay 1 --retry-all-errors \
              http://127.0.0.1:4173/topology-performance/ >/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              return 1
            fi
            if ! (cd "$side" && bun scripts/run-topology-renderer-canary.mjs) | tee "$output"; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              return 1
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          capture_semantics \
            reference \
            "$RUNNER_TEMP/reference-topology-renderer-result.json" \
            "$RUNNER_TEMP/reference-topology-renderer-server.log"
          capture_semantics \
            candidate \
            "$RUNNER_TEMP/candidate-topology-renderer-result.json" \
            "$RUNNER_TEMP/candidate-topology-renderer-server.log"

          jq -S '{operationCount, finalVertexCount, finalTriangleCount}' \
            "$RUNNER_TEMP/reference-topology-renderer-result.json" \
            > "$RUNNER_TEMP/reference-topology-renderer-semantic.json"
          jq -S '{operationCount, finalVertexCount, finalTriangleCount}' \
            "$RUNNER_TEMP/candidate-topology-renderer-result.json" \
            > "$RUNNER_TEMP/candidate-topology-renderer-semantic.json"
          diff -u \
            "$RUNNER_TEMP/reference-topology-renderer-semantic.json" \
            "$RUNNER_TEMP/candidate-topology-renderer-semantic.json"

      - name: Capture repeated Chromium calibration evidence
        run: |
          set -euo pipefail
          calibration_root="$RUNNER_TEMP/topology-renderer-browser-calibration"
          mkdir -p \
            "$calibration_root/reference" \
            "$calibration_root/candidate" \
            "$calibration_root/comparisons" \
            "$calibration_root/server-logs"
          printf 'run_id\tfirst\tsecond\n' > "$calibration_root/capture-order.tsv"

          capture_browser() {
            local side="$1"
            local run_id="$2"
            local output="$calibration_root/$side/$run_id"
            local server_log="$calibration_root/server-logs/$side-$run_id.log"
            python3 -m http.server 4173 \
              --bind 127.0.0.1 \
              --directory "$side/web/out" \
              >"$server_log" 2>&1 &
            local server_pid=$!
            if ! curl --fail --retry 20 --retry-delay 1 --retry-all-errors \
              http://127.0.0.1:4173/topology-performance/ >/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              return 1
            fi
            if ! (
              cd "$side"
              runtime-profiler capture \
                --scenario profiles/runtime-profiler/topology-renderer-browser.json \
                --output "$output"
              runtime-profiler validate --bundle "$output"
            ); then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              return 1
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          for run_number in $(seq 1 "$TOPOLOGY_BROWSER_CALIBRATION_RUNS"); do
            run_id=$(printf 'run-%02d' "$run_number")
            if (( run_number % 2 == 1 )); then
              first=reference
              second=candidate
            else
              first=candidate
              second=reference
            fi
            printf '%s\t%s\t%s\n' "$run_id" "$first" "$second" >> "$calibration_root/capture-order.tsv"
            capture_browser "$first" "$run_id"
            capture_browser "$second" "$run_id"
            runtime-profiler compare-browser \
              --reference "$calibration_root/reference/$run_id" \
              --candidate "$calibration_root/candidate/$run_id" \
              --json | tee "$calibration_root/comparisons/$run_id.json"
            jq -e '.status == "comparable"' "$calibration_root/comparisons/$run_id.json" >/dev/null
          done

          (cd candidate && bun scripts/summarize-topology-browser-calibration.mjs \
            "$calibration_root/reference" \
            "$calibration_root/candidate" \
            "$calibration_root/summary.json")

      - name: Summarize calibration evidence
        run: |
          set -euo pipefail
          calibration_root="$RUNNER_TEMP/topology-renderer-browser-calibration"
          {
            echo '### Topology renderer Chromium calibration'
            echo
            echo '> Semantic/runtime comparability is required. Runtime is calibration-only: no runtime budget or performance gate is enabled.'
            echo '> Capture order is counterbalanced so reference-first and candidate-first pairs are equally represented.'
            echo '> Relative deltas are reported only for timings with a strictly positive reference; long-task evidence remains absolute.'
            echo
            echo '#### Capture order'
            echo '```text'
            cat "$calibration_root/capture-order.tsv"
            echo '```'
            echo
            echo '#### Reference work counters'
            jq '.work' "$RUNNER_TEMP/reference-topology-renderer-result.json"
            echo
            echo '#### Candidate work counters'
            jq '.work' "$RUNNER_TEMP/candidate-topology-renderer-result.json"
            echo
            echo '#### Repeated browser calibration'
            echo '```json'
            jq '{
              runCountPerSide,
              runtimeBudget,
              identity,
              reference: {
                topLevelDurationUs: .reference.topLevelDurationUs,
                longTaskCount: .reference.longTaskCount,
                longTaskTotalDurationUs: .reference.longTaskTotalDurationUs,
                longestTaskUs: .reference.longestTaskUs,
                javascriptInclusiveDurationUs: .reference.javascriptInclusiveDurationUs
              },
              candidate: {
                topLevelDurationUs: .candidate.topLevelDurationUs,
                longTaskCount: .candidate.longTaskCount,
                longTaskTotalDurationUs: .candidate.longTaskTotalDurationUs,
                longestTaskUs: .candidate.longestTaskUs,
                javascriptInclusiveDurationUs: .candidate.javascriptInclusiveDurationUs
              },
              pairedCandidateVsReference
            }' "$calibration_root/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload topology renderer calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topology-renderer-browser-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/topology-renderer-browser-calibration
            ${{ runner.temp }}/reference-topology-renderer-result.json
            ${{ runner.temp }}/candidate-topology-renderer-result.json
            ${{ runner.temp }}/reference-topology-renderer-semantic.json
            ${{ runner.temp }}/candidate-topology-renderer-semantic.json
            ${{ runner.temp }}/reference-topology-renderer-server.log
            ${{ runner.temp }}/candidate-topology-renderer-server.log
          if-no-files-found: warn
          retention-days: 90

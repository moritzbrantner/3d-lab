name: Temporary rustfmt fixer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'rustfmt-bot'
          git config user.email 'rustfmt-bot@invalid'
          git add crates
          git commit -m 'Apply rustfmt'
          git push origin "HEAD:${{ github.head_ref }}"

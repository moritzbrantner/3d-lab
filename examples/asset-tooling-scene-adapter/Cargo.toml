[package]
name = "asset-tooling-scene-adapter"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "asset-tooling-scene-adapter"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
three-d-animation = { path = "../../crates/three-d-animation" }
three-d-core = { path = "../../crates/three-d-core" }
three-d-export = { path = "../../crates/three-d-export" }
three-d-scene = { path = "../../crates/three-d-scene" }

[[bin]]
name = "scene_export_glb"
path = "src/bin/scene_export_glb.rs"

[package]
name = "three-d-animation"
version = "0.1.0"
edition = "2024"
description = "Renderer-independent transforms and animation fundamentals for 3d-lab"
license = "MIT"

[dependencies]
three-d-core = { path = "../three-d-core" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "clip_sampling"
harness = false

[[bench]]
name = "retargeting"
harness = false

[[bench]]
name = "ik_layering"
harness = false

[package]
name = "three-d-character-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Thin browser adapter for imported character Rust rig and playback authorities"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
serde_json = "1"
three-d-animation = { path = "../three-d-animation" }
three-d-formats = { path = "../three-d-formats" }
three-d-playback = { path = "../three-d-playback" }
